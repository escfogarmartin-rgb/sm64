<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Super Mario 64</title>
  <style>
    :root { color-scheme: dark; --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; min-height: 100%; background: #000; }
    body { min-height: 100vh; min-height: 100dvh; }
    #container { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); display: grid; place-items: center; background: #000; }
    #bg-fill { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; pointer-events: none; display: none; filter: blur(28px) brightness(.75) saturate(1.1); transform: scale(1.15); }
    html.fill-blur #bg-fill { display: block; }
    html.fill-blur #container { background: transparent; }
    #container { z-index: 1; }
    #game-frame { position: relative; max-width: 100%; max-height: 100%; }
    #canvas { display: block; width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; image-rendering: pixelated; outline: none; }
    #touch-controls { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: .78; }
    .control { pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    #stick { position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: calc(max(18px, var(--safe-bottom)) + 10px); width: clamp(112px, 26vw, 154px); aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,255,255,.45); background: rgba(24,32,48,.38); box-shadow: inset 0 0 0 9px rgba(255,255,255,.06); }
    #stick::before { content: ""; position: absolute; inset: 28%; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; }
    #knob { position: absolute; left: 50%; top: 50%; width: 40%; height: 40%; border-radius: 50%; background: rgba(245,248,255,.55); border: 2px solid rgba(255,255,255,.8); transform: translate(-50%,-50%); }
    #actions { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: calc(max(18px, var(--safe-bottom)) + 12px); width: clamp(142px, 34vw, 194px); height: 150px; }
    .action { position: absolute; width: clamp(58px, 15vw, 76px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; color: white; font: 700 16px/1 Arial, sans-serif; border: 2px solid rgba(255,255,255,.65); background: rgba(38,52,72,.56); box-shadow: 0 3px 10px #0008, inset 0 0 10px #ffffff12; }
    .action[data-key="KeyX"] { right: 0; bottom: 12px; width: clamp(70px, 18vw, 88px); background: rgba(36,108,206,.62); }
    .action[data-key="KeyC"] { left: 0; bottom: 0; }
    .action[data-key="Space"] { right: 54px; top: 0; width: 52px; font-size: 13px; }
    .action[data-key="Enter"] { left: 50px; top: 32px; width: 42px; font-size: 10px; }
    .action:active, .action.pressed { background: rgba(70,140,235,.82); transform: scale(.96); }
    #audio-hint { position: fixed; top: calc(var(--safe-top) + 10px); left: 50%; z-index: 3; transform: translateX(-50%); padding: 7px 11px; border-radius: 999px; color: #fff; background: #0009; font: 12px/1.2 Arial,sans-serif; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap; }
    #audio-hint.visible { opacity: .8; }
    #fullscreen-toggle { position: fixed; z-index: 5; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 46px; height: 42px; border: 1px solid rgba(255,255,255,.65); border-radius: 12px; color: white; background: rgba(18,24,36,.58); font: 26px/1 Arial,sans-serif; opacity: .78; box-shadow: 0 2px 8px #0008; }
    #fullscreen-toggle:active { opacity: 1; transform: scale(.96); }
    #screen-hint { position: fixed; z-index: 5; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); max-width: calc(100vw - 100px); padding: 9px 12px; border-radius: 999px; background: #000b; color: white; font: 13px/1.3 Arial,sans-serif; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
    #screen-hint.visible { opacity: .9; }
    #layout-toggle { position: fixed; z-index: 5; top: max(12px, env(safe-area-inset-top)); right: calc(max(12px, env(safe-area-inset-right)) + 54px); width: 46px; height: 42px; border: 1px solid rgba(255,255,255,.65); border-radius: 12px; color: white; background: rgba(18,24,36,.58); font: 24px/1 Arial,sans-serif; opacity: .78; box-shadow: 0 2px 8px #0008; }
    #layout-toggle:active { opacity: 1; transform: scale(.96); }
    #layout-panel { position: fixed; z-index: 9; left: 50%; top: calc(var(--safe-top) + 8px); transform: translateX(-50%); width: min(330px, calc(100vw - 24px)); padding: 10px 12px; border-radius: 14px; background: rgba(10,14,22,.9); color: #fff; font: 12px/1.35 Arial,sans-serif; box-shadow: 0 4px 16px #000a; touch-action: manipulation; }
    #layout-panel[hidden] { display: none; }
    #layout-panel .lp-title { font-weight: 700; font-size: 13px; }
    #layout-panel .lp-hint { opacity: .75; margin: 2px 0 6px; }
    #layout-panel label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    #layout-panel label span { width: 62px; flex: none; }
    #layout-panel input[type=range] { flex: 1; min-width: 0; }
    #layout-panel .lp-row { display: flex; gap: 8px; margin-top: 8px; }
    #layout-panel button { flex: 1; padding: 8px 6px; border-radius: 10px; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.12); color: #fff; font: 600 12px Arial,sans-serif; }
    #layout-panel #lp-done { background: rgba(36,108,206,.85); }
    #touch-controls.editing .control { outline: 2px dashed rgba(255,255,255,.75); outline-offset: 2px; }
    #touch-controls.editing .control.selected { outline: 3px solid #ffd54a; outline-offset: 2px; }
    @media (orientation: portrait) {
      #stick { width: clamp(118px, 31vw, 158px); }
      #actions { width: clamp(150px, 39vw, 194px); }
    }
    @media (orientation: landscape) and (max-height: 560px) {
      #stick { width: min(22vh, 92px); left: max(12px, env(safe-area-inset-left)); bottom: calc(max(10px, var(--safe-bottom)) + 4px); }
      #actions { width: 148px; height: 108px; right: max(12px, env(safe-area-inset-right)); bottom: calc(max(10px, var(--safe-bottom)) + 4px); }
      .action { width: 56px; font-size: 14px; }
      .action[data-key="KeyX"] { width: 68px; bottom: 0; }
      .action[data-key="KeyC"] { width: 56px; bottom: 0; }
      .action[data-key="Space"] { width: 42px; right: 48px; }
      .action[data-key="Enter"] { width: 38px; left: 42px; top: 23px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <video id="bg-fill" muted playsinline autoplay aria-hidden="true"></video>
  <main id="container">
    <div id="game-frame"><canvas id="canvas" class="emscripten" width="1920" height="1080" tabindex="0"></canvas></div>
  </main>
  <div id="touch-controls" aria-label="Controles táctiles">
    <div id="stick" class="control" role="application" aria-label="Joystick virtual"><div id="knob"></div></div>
    <div id="actions">
      <button class="control action" type="button" data-key="KeyX" aria-label="Saltar">A</button>
      <button class="control action" type="button" data-key="KeyC" aria-label="Acción">B</button>
      <button class="control action" type="button" data-key="Space" aria-label="Agacharse">Z</button>
      <button class="control action" type="button" data-key="Enter" aria-label="Iniciar o pausar">START</button>
    </div>
  </div>
  <div id="audio-hint" role="status">Tocá para activar el sonido</div>
  <button id="fullscreen-toggle" class="control" type="button" aria-label="Activar pantalla completa" title="Pantalla completa">⛶</button>
  <div id="screen-hint" role="status"></div>
  <button id="layout-toggle" class="control" type="button" aria-label="Editar controles" title="Editar controles">⚙</button>
  <div id="layout-panel" hidden>
    <div class="lp-title">Editar controles: <span id="lp-name">tocá uno</span></div>
    <div class="lp-hint">Arrastrá un botón para moverlo. Tocalo para cambiar su tamaño.</div>
    <label><span>Tamaño</span><input id="lp-size" type="range" min="0.5" max="2" step="0.05" value="1" disabled></label>
    <label><span>Opacidad</span><input id="lp-opacity" type="range" min="0.2" max="1" step="0.05" value="0.78"></label>
    <div class="lp-row"><button id="lp-reset" type="button">Restablecer</button><button id="lp-done" type="button">Listo</button></div>
  </div>
  <script>
    // Pruebas de diagnóstico del recorte de diálogos (solo se activan con parámetros en la URL)
    (function patchGL() {
      var q = new URLSearchParams(location.search);
      var noScissor = q.get('noscissor') !== '0';
      var logScissor = q.get('scissorlog') === '1';
      if (!noScissor && !logScissor) return;
      var SCISSOR_TEST = 0x0C11, logged = 0, seen = {};

          return origEnable.call(this, cap);

        p.scissor = function(x, y, w, h) {
          if (logScissor && logged < 40) {
            var k = [x, y, w, h, this.drawingBufferWidth, this.drawingBufferHeight].join(',');
            if (!seen[k]) { seen[k] = 1; logged++; console.log('[scissor] x,y,w,h,bufW,bufH = ' + k); }
          }
          if (noScissor) return;
          return origScissor.call(this, x, y, w, h);
        };
      });
    })();
    var Module = {
      preRun: [], postRun: [],
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      canvas: document.getElementById('canvas'),
      setStatus: function() {}
    };
    (function () {
      var canvas = Module.canvas;
      var container = document.getElementById('container');
      var gameFrame = document.getElementById('game-frame');
      var dispatchingCanvasResize = false;
      canvas.addEventListener('webglcontextlost', function(event) {
        alert('Se perdió el contexto gráfico. Recargá la página para continuar.');
        event.preventDefault();
      }, false);
      var stick = document.getElementById('stick');
      var knob = document.getElementById('knob');
      var pressed = new Set();
      var editing = false;
      var audioHint = document.getElementById('audio-hint');
      var screenHint = document.getElementById('screen-hint');
      var fullscreenToggle = document.getElementById('fullscreen-toggle');
      var keyInfo = {
        ArrowUp: { key: 'ArrowUp', code: 'ArrowUp', keyCode: 38 },
        ArrowDown: { key: 'ArrowDown', code: 'ArrowDown', keyCode: 40 },
        ArrowLeft: { key: 'ArrowLeft', code: 'ArrowLeft', keyCode: 37 },
        ArrowRight: { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 },
        KeyW: { key: 'w', code: 'KeyW', keyCode: 87 },
        KeyA: { key: 'a', code: 'KeyA', keyCode: 65 },
        KeyS: { key: 's', code: 'KeyS', keyCode: 83 },
        KeyD: { key: 'd', code: 'KeyD', keyCode: 68 },
        KeyX: { key: 'x', code: 'KeyX', keyCode: 88 },
        KeyC: { key: 'c', code: 'KeyC', keyCode: 67 },
        Space: { key: ' ', code: 'Space', keyCode: 32 },
        Enter: { key: 'Enter', code: 'Enter', keyCode: 13 }
      };
      function keyEvent(code, down) {
        var info = keyInfo[code];
        if (!info || editing || (down && pressed.has(code)) || (!down && !pressed.has(code))) return;
        if (down) pressed.add(code); else pressed.delete(code);
        canvas.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', {
          key: info.key, code: info.code, keyCode: info.keyCode, which: info.keyCode,
          bubbles: true, cancelable: true, repeat: false
        }));
      }
      function releaseAll() {
        Array.from(pressed).forEach(function(code) { keyEvent(code, false); });
      }
      function unlockAudio() {
        var ctx = Module.SDL2 && Module.SDL2.audioContext;
        if (!ctx || ctx.state !== 'suspended') return;
        ctx.resume().then(function() { audioHint.classList.remove('visible'); })
          .catch(function() { audioHint.classList.add('visible'); });
        setTimeout(function() {
          if (ctx.state === 'suspended') audioHint.classList.add('visible');
        }, 700);
      }
      document.addEventListener('pointerdown', unlockAudio, { passive: true });
      function showScreenHint(message) {
        screenHint.textContent = message;
        screenHint.classList.add('visible');
        clearTimeout(showScreenHint.timer);
        showScreenHint.timer = setTimeout(function() { screenHint.classList.remove('visible'); }, 2600);
      }
      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement || document.webkitIsFullScreen);
      }
      function updateFullscreenButton() {
        var active = isFullscreen();
        fullscreenToggle.textContent = active ? '×' : '⛶';
        fullscreenToggle.setAttribute('aria-label', active ? 'Salir de pantalla completa' : 'Activar pantalla completa');
        fullscreenToggle.title = active ? 'Salir de pantalla completa' : 'Pantalla completa';
      }
      fullscreenToggle.addEventListener('click', async function() {
        if (isFullscreen()) {
          try {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
          } catch (error) { showScreenHint('No se pudo salir de pantalla completa.'); }
          return;
        }
        try {
          var enter = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
          if (!enter) throw new Error('Fullscreen API unavailable');
          try { await enter.call(document.documentElement, { navigationUI: 'hide' }); }
          catch (error) { await enter.call(document.documentElement); }
          updateFullscreenButton();
          if (screen.orientation && screen.orientation.lock) {
            try { await screen.orientation.lock('landscape'); }
            catch (error) { showScreenHint('Pantalla completa activada. Si no gira, poné el teléfono en horizontal.'); }
          } else if (matchMedia('(orientation: portrait)').matches) {
            showScreenHint('Pantalla completa activada. Poné el teléfono en horizontal para jugar.');
          }
        } catch (error) {
          showScreenHint('Este navegador no permitió la pantalla completa.');
        }
      });
      function handleFullscreenChange() {
        updateFullscreenButton();
        scheduleViewportUpdate();
        setTimeout(scheduleViewportUpdate, 250);
      }
      document.addEventListener('fullscreenchange', handleFullscreenChange);
      document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
      var baseGameAspect = 16 / 9;
      // Ajustes (se pueden probar desde la URL: ?maxAspect=2.2&width=1920)
      var params = new URLSearchParams(location.search);
      var maxPanoramicAspect = Math.max(16 / 9, Math.min(parseFloat(params.get('maxAspect')) || 3, 3));
      var fillMode = params.get('fill') || 'none'; // 'blur' (por defecto) o 'none' para negro
      (function setupFill() {
        if (fillMode !== 'blur' || !canvas.captureStream) return;
        try {
          var bg = document.getElementById('bg-fill');
          bg.srcObject = canvas.captureStream(30);
          document.documentElement.classList.add('fill-blur');
          var p = bg.play(); if (p && p.catch) p.catch(function() {});
        } catch (error) { document.documentElement.classList.remove('fill-blur'); }
      })();
      var RENDER_WIDTH = Math.max(640, Math.min(parseInt(params.get('width'), 10) || 1920, 2560)); // si va lento en el celu, probá width=1280
      function targetGameAspect(safeWidth, safeHeight) {
        if (safeWidth <= safeHeight || safeHeight <= 0) return baseGameAspect;
        var availableAspect = safeWidth / safeHeight;
        if (availableAspect <= baseGameAspect) return baseGameAspect;

      function resizeCanvasBuffer(width, height) {
        var initialized = !!(Module.ctx || canvas.GLctxObject);

        else { canvas.width = width; canvas.height = height; }
        var gl = Module.ctx || (canvas.GLctxObject && canvas.GLctxObject.GLctx);
        if (gl && typeof gl.viewport === 'function') gl.viewport(0, 0, width, height);
        if (initialized) {
          dispatchingCanvasResize = true;
          try { window.dispatchEvent(new Event('resize')); }
          finally { dispatchingCanvasResize = false; }
        }
      }
      function updateGameViewport() {
        var bounds = container.getBoundingClientRect();
        var style = window.getComputedStyle(container);
        var safeWidth = bounds.width - (parseFloat(style.paddingLeft) || 0) - (parseFloat(style.paddingRight) || 0);
        var safeHeight = bounds.height - (parseFloat(style.paddingTop) || 0) - (parseFloat(style.paddingBottom) || 0);
        var aspect = targetGameAspect(safeWidth, safeHeight);
        var displayWidth = Math.max(0, Math.min(safeWidth, safeHeight * aspect));
        var displayHeight = displayWidth / aspect;
        var renderWidth = RENDER_WIDTH;
        var renderHeight = Math.round(RENDER_WIDTH / aspect);
        if (displayWidth > 0 && (canvas.width !== renderWidth || canvas.height !== renderHeight)) {
          try {
            resizeCanvasBuffer(renderWidth, renderHeight);
          } catch (error) {
            aspect = canvas.width / canvas.height || baseGameAspect;
            displayWidth = Math.max(0, Math.min(safeWidth, safeHeight * aspect));
            displayHeight = displayWidth / aspect;
          }
        }
        if (canvas.width > 0 && canvas.height > 0) {
          aspect = canvas.width / canvas.height;
          displayWidth = Math.max(0, Math.min(safeWidth, safeHeight * aspect));
          displayHeight = displayWidth / aspect;
        }
        gameFrame.style.width = displayWidth + 'px';
        gameFrame.style.height = displayHeight + 'px';
      }
      function scheduleViewportUpdate() {
        requestAnimationFrame(updateGameViewport);
      }
      window.addEventListener('resize', function() {
        if (!dispatchingCanvasResize) scheduleViewportUpdate();
      }, { passive: true });
      window.addEventListener('orientationchange', function() {
        scheduleViewportUpdate();
        setTimeout(scheduleViewportUpdate, 250);
      }, { passive: true });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', function() { scheduleViewportUpdate(); }, { passive: true });
      if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', function() { scheduleViewportUpdate(); });
      updateGameViewport();

      var pointerId = null;
      var cameraPointer = null, cameraX = 0, cameraY = 0;
      canvas.addEventListener('pointerdown', function(event) {
        if (event.pointerType !== 'touch') return;
        cameraPointer = event.pointerId; cameraX = event.clientX; cameraY = event.clientY;
        canvas.setPointerCapture(cameraPointer);

      canvas.addEventListener('pointermove', function(event) {
        if (event.pointerId !== cameraPointer) return;

        cameraX = event.clientX; cameraY = event.clientY;
        var threshold = 7;
        keyEvent('KeyA', dx < -threshold); keyEvent('KeyD', dx > threshold);
        keyEvent('KeyW', dy < -threshold); keyEvent('KeyS', dy > threshold);
      });
      function endCamera(event) {
        if (event && event.pointerId !== cameraPointer) return;
        cameraPointer = null;
        keyEvent('KeyW', false); keyEvent('KeyA', false);
        keyEvent('KeyS', false); keyEvent('KeyD', false);
      }
      canvas.addEventListener('pointerup', endCamera);
      canvas.addEventListener('pointercancel', endCamera);
      function moveStick(event) {
        var rect = stick.getBoundingClientRect();
        var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;

        var max = rect.width * .32, length = Math.hypot(dx, dy);
        if (length > max) { dx = dx / length * max; dy = dy / length * max; }

      }
      stick.addEventListener('pointerdown', function(event) {

      });
      stick.addEventListener('pointerup', function(event) { if (event.pointerId === pointerId) resetStick(); });
      stick.addEventListener('pointercancel', resetStick);
      document.querySelectorAll('.action').forEach(function(button) {
        var code = button.dataset.key;
        button.addEventListener('pointerdown', function(event) {
          event.preventDefault(); unlockAudio();
          button.setPointerCapture(event.pointerId); keyEvent(code, true); button.classList.add('pressed');

        function release(event) {
          if (event) event.preventDefault();
          keyEvent(code, false); button.classList.remove('pressed');
        }
        button.addEventListener('pointerup', release);
        button.addEventListener('pointercancel', release);
        button.addEventListener('lostpointercapture', release);
      });
      // ---- Editor de controles táctiles (posición, tamaño y opacidad; se guarda en este navegador) ----
      var LAYOUT_KEY = 'sm64-touch-layout-v1';
      var ctlEls = {
        stick: stick,
        KeyX: document.querySelector('.action[data-key="KeyX"]'),
        KeyC: document.querySelector('.action[data-key="KeyC"]'),
        Space: document.querySelector('.action[data-key="Space"]'),
        Enter: document.querySelector('.action[data-key="Enter"]')
      };
      var ctlNames = { stick: 'Joystick', KeyX: 'A', KeyC: 'B', Space: 'Z', Enter: 'START' };
      var touchRoot = document.getElementById('touch-controls');
      var layoutPanel = document.getElementById('layout-panel');
      var layoutToggle = document.getElementById('layout-toggle');
      var nameLabel = document.getElementById('lp-name');
      var sizeInput = document.getElementById('lp-size');
      var opacityInput = document.getElementById('lp-opacity');
      var layouts = {}, selected = null, editKey = null, dirty = false;
      try {
        var rawLayout = localStorage.getItem(LAYOUT_KEY);
        var parsedLayout = rawLayout && JSON.parse(rawLayout);
        if (parsedLayout && typeof parsedLayout === 'object') layouts = parsedLayout;
      } catch (error) { layouts = {}; }
      function saveLayouts() { try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layouts)); } catch (error) {} }
      function orientKey() { return matchMedia('(orientation: portrait)').matches ? 'port' : 'land'; }
      function clampNum(v, a, b) { return Math.max(a, Math.min(b, v)); }
      function round1(n) { return Math.round(n * 10) / 10; }
      function viewW() { return document.documentElement.clientWidth || window.innerWidth; }
      function viewH() { return document.documentElement.clientHeight || window.innerHeight; }
      function clearControl(name) {
        var el = ctlEls[name];
        ['position', 'left', 'top', 'right', 'bottom', 'translate', 'scale'].forEach(function(p) { el.style.removeProperty(p); });
      }
      function applyControl(name, d) {
        var el = ctlEls[name];
        el.style.setProperty('position', 'fixed');
        el.style.setProperty('left', d.x + '%');
        el.style.setProperty('top', d.y + '%');
        el.style.setProperty('right', 'auto');
        el.style.setProperty('bottom', 'auto');
        el.style.setProperty('translate', '-50% -50%');
        el.style.setProperty('scale', String(d.s));
      }
      function applyLayout() {
        var set = layouts[orientKey()];
        Object.keys(ctlEls).forEach(function(name) {
          if (set && set[name]) applyControl(name, set[name]); else clearControl(name);
        });
        if (typeof layouts.opacity === 'number') touchRoot.style.opacity = layouts.opacity;
        else touchRoot.style.removeProperty('opacity');
      }
      function materialize() {
        var set = layouts[editKey] || (layouts[editKey] = {});
        var vw = viewW(), vh = viewH(), fresh = {};
        Object.keys(ctlEls).forEach(function(name) {
          if (set[name]) return;
          var r = ctlEls[name].getBoundingClientRect();
          fresh[name] = { x: round1((r.left + r.width / 2) / vw * 100), y: round1((r.top + r.height / 2) / vh * 100), s: 1 };
        });
        Object.keys(fresh).forEach(function(name) { set[name] = fresh[name]; applyControl(name, set[name]); });
      }
      function selectControl(name) {
        selected = name;
        Object.keys(ctlEls).forEach(function(n) { ctlEls[n].classList.toggle('selected', n === name); });
        nameLabel.textContent = name ? ctlNames[name] : 'tocá uno';
        sizeInput.disabled = !name;
        if (name) sizeInput.value = layouts[editKey][name].s;
      }
      function setToggleIcon(open) {
        layoutToggle.textContent = open ? '×' : '⚙';
        layoutToggle.setAttribute('aria-label', open ? 'Cerrar editor de controles' : 'Editar controles');
        layoutToggle.title = open ? 'Cerrar editor de controles' : 'Editar controles';
      }
      function enterEdit() {
        releaseAll();
        editing = true; dirty = false; editKey = orientKey();
        touchRoot.classList.add('editing');
        layoutPanel.hidden = false;
        setToggleIcon(true);
        opacityInput.value = typeof layouts.opacity === 'number' ? layouts.opacity : 0.78;
        materialize();
        selectControl(null);
      }
      function exitEdit() {
        if (!editing) return;
        editing = false;
        touchRoot.classList.remove('editing');
        layoutPanel.hidden = true;
        setToggleIcon(false);
        selectControl(null);
        if (!dirty && layouts[editKey]) { delete layouts[editKey]; }
        saveLayouts();
        applyLayout();
      }
      layoutToggle.addEventListener('click', function() { if (editing) exitEdit(); else enterEdit(); });
      document.getElementById('lp-done').addEventListener('click', exitEdit);
      document.getElementById('lp-reset').addEventListener('click', function() {
        delete layouts[editKey]; delete layouts.opacity; dirty = false;
        applyLayout(); materialize(); selectControl(null);
        opacityInput.value = 0.78;
        saveLayouts();
      });
      sizeInput.addEventListener('input', function() {
        if (!selected) return;
        var d = layouts[editKey][selected];
        d.s = parseFloat(sizeInput.value) || 1; dirty = true;
        applyControl(selected, d);
      });
      sizeInput.addEventListener('change', saveLayouts);
      opacityInput.addEventListener('input', function() {
        layouts.opacity = parseFloat(opacityInput.value) || 0.78; dirty = true;
        touchRoot.style.opacity = layouts.opacity;
      });
      opacityInput.addEventListener('change', saveLayouts);
      Object.keys(ctlEls).forEach(function(name) {
        var el = ctlEls[name], drag = null;
        el.addEventListener('pointerdown', function(event) {
          if (!editing) return;
          event.preventDefault(); event.stopImmediatePropagation();
          selectControl(name);
          var d = layouts[editKey][name];
          drag = { id: event.pointerId, px: event.clientX, py: event.clientY, x: d.x, y: d.y };
          try { el.setPointerCapture(event.pointerId); } catch (error) {}
        }, true);
        el.addEventListener('pointermove', function(event) {
          if (!editing) return;
          event.stopImmediatePropagation();
          if (!drag || event.pointerId !== drag.id) return;
          event.preventDefault();
          var d = layouts[editKey][name];
          d.x = round1(clampNum(drag.x + (event.clientX - drag.px) / viewW() * 100, 2, 98));
          d.y = round1(clampNum(drag.y + (event.clientY - drag.py) / viewH() * 100, 3, 97));
          dirty = true;
          applyControl(name, d);
        }, true);
        function endDrag(event) {
          if (!editing) return;
          event.stopImmediatePropagation();
          if (!drag || event.pointerId !== drag.id) return;
          drag = null; saveLayouts();
        }
        el.addEventListener('pointerup', endDrag, true);
        el.addEventListener('pointercancel', endDrag, true);
      });
      var lastOrient = orientKey();
      function onOrientationChange() {
        var key = orientKey();
        if (key === lastOrient) return;
        if (editing) exitEdit();
        lastOrient = key;
        applyLayout();
      }
      window.addEventListener('resize', onOrientationChange, { passive: true });
      window.addEventListener('orientationchange', function() { setTimeout(onOrientationChange, 50); }, { passive: true });
      applyLayout();

      window.addEventListener('blur', releaseAll);
      document.addEventListener('visibilitychange', function() { if (document.hidden) releaseAll(); });
    })();
  </script>
